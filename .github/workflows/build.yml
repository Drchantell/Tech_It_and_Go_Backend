name: Backend Code Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/tech_it_go_test
      MONGO_DB_NAME: tech_it_go_test
      JWT_SECRET: github-actions-test-secret
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run API integration tests
        run: npm test

      - name: Package backend source
        run: zip -r tech-it-go-backend-source.zip . -x "node_modules/*" ".git/*"

      - name: Upload backend source
        uses: actions/upload-artifact@v4
        with:
          name: tech-it-go-backend-source
          path: tech-it-go-backend-source.zip
          retention-days: 7
