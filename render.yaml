services:
  - type: web
    name: tech-it-and-go-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: TechItAndGo
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
